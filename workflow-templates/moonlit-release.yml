name: Release

on:
  push:
    branches: ['$default-branch']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Moonlit reads commit history to decide the next version. A shallow
          # clone silently produces the wrong answer, so fetch everything.
          fetch-depth: 0

      - uses: wolfware-labs/setup-moonlit@v1

      - run: moonlit run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
